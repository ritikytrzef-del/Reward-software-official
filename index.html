<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Software – Official Telegram Mini App List</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4F46E5;--primary-grad:linear-gradient(135deg,#4F46E5,#06B6D4);
  --accent:#06B6D4;--green:#22C55E;--bg:#F8F9FC;--card:#FFFFFF;
  --text:#0F172A;--muted:#64748B;--border:#E2E8F0;
  --hero-bg:linear-gradient(160deg,#EEF2FF 0%,#E0F2FE 50%,#F0FDF4 100%);
  --shadow:0 1px 3px rgba(0,0,0,0.07),0 8px 24px rgba(79,70,229,0.07);
  --shadow-lg:0 4px 6px rgba(0,0,0,0.05),0 20px 40px rgba(79,70,229,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;}

/* NAV */
nav{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;padding:0 20px;}
.nav-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;}
.logo-icon{width:40px;height:40px;background:var(--primary-grad);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;color:#fff;font-size:14px;flex-shrink:0;}
.logo-text{font-family:'Manrope',sans-serif;font-weight:700;font-size:17px;color:var(--text);}
.hamburger{background:none;border:none;cursor:pointer;padding:8px;display:flex;flex-direction:column;gap:5px;}
.hamburger span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px;}

/* MENU */
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.menu-overlay.open{opacity:1;pointer-events:all;}
.menu-drawer{position:fixed;top:0;right:-300px;width:285px;height:100%;background:#fff;z-index:400;padding:24px 20px;transition:right 0.3s;box-shadow:-4px 0 20px rgba(0,0,0,0.1);overflow-y:auto;}
.menu-drawer.open{right:0;}
.menu-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
.menu-close{background:none;border:none;cursor:pointer;font-size:22px;color:var(--muted);line-height:1;}
.menu-links{display:flex;flex-direction:column;gap:4px;}
.menu-link{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:12px;text-decoration:none;color:var(--text);font-weight:600;font-size:15px;font-family:'Manrope',sans-serif;transition:background 0.2s;cursor:pointer;border:none;background:none;width:100%;text-align:left;}
.menu-link:hover{background:#F5F3FF;color:var(--primary);}
.menu-link svg{width:18px;height:18px;flex-shrink:0;}
.menu-link-sm{font-size:14px;font-weight:500;color:var(--muted);}
.menu-div{height:1px;background:var(--border);margin:10px 0;}
.menu-social-section{padding:4px 4px 0;}
.menu-social-label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#94A3B8;margin-bottom:8px;padding:0 8px;}
.menu-social-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.menu-soc-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;border-radius:10px;text-decoration:none;font-size:12px;font-weight:700;font-family:'Manrope',sans-serif;transition:opacity 0.2s;}
.menu-soc-btn:hover{opacity:0.85;}
.menu-soc-btn svg{width:16px;height:16px;fill:currentColor;flex-shrink:0;}
.ms-fb{background:#E7F3FF;color:#1877F2;}
.ms-ig{background:#FEE2F8;color:#bc1888;}
.ms-yt{background:#FFE9E9;color:#FF0000;}
.ms-tg{background:#E3F4FD;color:#229ED9;}

/* PAGES */
.page{display:none;}
.page.active{display:block;}

/* HERO */
.hero{background:var(--hero-bg);padding:48px 20px 56px;text-align:center;}
.hero-inner{max-width:560px;margin:0 auto;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.8);border:1px solid rgba(99,102,241,0.2);border-radius:100px;padding:8px 16px;font-size:13px;color:var(--primary);font-weight:600;margin-bottom:24px;backdrop-filter:blur(8px);}
.hero h1{font-family:'Manrope',sans-serif;font-size:clamp(32px,8vw,46px);font-weight:900;line-height:1.1;letter-spacing:-1.5px;margin-bottom:16px;}
.hero h1 span{color:var(--accent);}
.hero p{font-size:16px;color:var(--muted);font-weight:500;margin-bottom:32px;line-height:1.7;}
.hero-btns{display:flex;flex-direction:column;gap:12px;align-items:center;}
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--primary-grad);color:#fff;font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;padding:16px 32px;border-radius:14px;text-decoration:none;border:none;cursor:pointer;width:100%;max-width:320px;justify-content:center;transition:transform 0.2s;box-shadow:0 4px 20px rgba(79,70,229,0.35);}
.btn-primary:hover{transform:translateY(-1px);}
.btn-secondary{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--text);font-family:'Manrope',sans-serif;font-weight:600;font-size:16px;padding:15px 32px;border-radius:14px;text-decoration:none;border:1.5px solid var(--border);cursor:pointer;width:100%;max-width:320px;justify-content:center;transition:border-color 0.2s;}
.btn-secondary:hover{border-color:var(--primary);}
.hero-stats{display:flex;justify-content:center;gap:32px;margin-top:32px;flex-wrap:wrap;}
.hero-stat{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);}
.hero-stat .dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
@media(min-width:600px){.hero-btns{flex-direction:row;justify-content:center;}.btn-primary,.btn-secondary{width:auto;max-width:none;}}

/* SECTIONS */
.section{padding:32px 20px;max-width:900px;margin:0 auto;}
.section-hdr{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:12px;}
.section-title{font-family:'Manrope',sans-serif;font-weight:800;font-size:21px;letter-spacing:-0.4px;}
.section-sub{font-size:13px;color:var(--muted);font-weight:500;margin-top:2px;}
.view-all{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border);border-radius:100px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--primary);white-space:nowrap;cursor:pointer;background:none;transition:background 0.2s;text-decoration:none;}
.view-all:hover{background:#F5F3FF;}

/* TELEGRAM ICON */
.tg-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2AABEE,#229ED9);flex-shrink:0;}
.tg-icon svg{width:30px;height:30px;fill:#fff;}

/* BOT CARD */
.bot-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);transition:box-shadow 0.2s,transform 0.2s;}
.bot-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);}
.card-tags{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:100px;font-size:12px;font-weight:600;}
.tv{background:#F0FDF4;color:#16A34A;border:1px solid #BBF7D0;}
.tt{background:#FFFBEB;color:#D97706;border:1px solid #FDE68A;}
.card-hdr{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.card-name{font-family:'Manrope',sans-serif;font-weight:800;font-size:18px;letter-spacing:-0.3px;}
.card-type{font-size:13px;color:var(--muted);font-weight:500;}
.card-desc{font-size:14px;color:var(--text);font-weight:500;line-height:1.65;margin-bottom:14px;}
.card-uname{background:#F8F9FC;border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.uname-left{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--primary);}
.uname-left svg{flex-shrink:0;}
.copy-btn{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;padding:5px 9px;border-radius:8px;transition:background 0.2s,color 0.2s;white-space:nowrap;}
.copy-btn:hover{background:var(--border);color:var(--text);}
.copy-btn.copied{color:var(--green);}

/* WITHDRAW METHODS */
.withdraw-section{margin-bottom:14px;}
.withdraw-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.withdraw-grid{display:flex;flex-direction:column;gap:8px;}
.withdraw-row{display:flex;align-items:center;justify-content:space-between;background:#F8F9FC;border:1px solid var(--border);border-radius:10px;padding:10px 13px;}
.withdraw-left{display:flex;align-items:center;gap:10px;}
.wicon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.wicon img{width:30px;height:30px;object-fit:contain;}
.wname{font-size:13px;font-weight:700;color:var(--text);}
.wnet{font-size:11px;color:var(--muted);font-weight:500;}
.wamt{font-size:13px;font-weight:800;color:#15803D;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:8px;padding:4px 10px;white-space:nowrap;}

/* HOW IT WORKS */
.how-sec{background:#fff;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:48px 20px;text-align:center;}
.how-lbl{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--primary);margin-bottom:10px;}
.how-title{font-family:'Manrope',sans-serif;font-size:28px;font-weight:900;letter-spacing:-0.8px;margin-bottom:6px;}
.how-sub{font-size:14px;color:var(--muted);font-weight:500;margin-bottom:32px;}
.how-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:560px;margin:0 auto;}
.how-card{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:20px 16px;position:relative;text-align:center;}
.how-num{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:26px;height:26px;background:var(--primary);color:#fff;border-radius:50%;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;}
.how-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:6px auto 12px;}
.i-purple{background:#EEF2FF;}.i-blue{background:#EFF6FF;}.i-green{background:#F0FDF4;}.i-gold{background:#FFFBEB;}
.how-ctitle{font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;margin-bottom:4px;}
.how-csub{font-size:12px;color:var(--muted);line-height:1.5;}

/* CARD ACTIONS */
.hts{background:#F8F9FC;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;}
.hts-lbl{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px;}
.hts-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.hts-step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;}
.snum{width:22px;height:22px;background:#EEF2FF;color:var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.card-actions{display:flex;gap:10px;}
.btn-open{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--primary-grad);color:#fff;font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;padding:13px 16px;border-radius:12px;text-decoration:none;border:none;cursor:pointer;}
.btn-open:hover{opacity:0.9;}
.btn-share{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#fff;color:var(--text);font-family:'Manrope',sans-serif;font-weight:600;font-size:14px;padding:13px 18px;border-radius:12px;border:1.5px solid var(--border);cursor:pointer;}
.btn-share:hover{background:#F8F9FC;}

/* ADS */
.ad-slot{margin:8px auto;max-width:860px;padding:0 20px;}
.ad-lbl{text-align:center;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#94A3B8;font-weight:600;margin-bottom:8px;}
.ad-box{background:#F1F5F9;border:1.5px dashed #CBD5E1;border-radius:16px;height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94A3B8;gap:6px;}
.ad-box b{font-size:16px;color:#64748B;}
.vid-ad{background:linear-gradient(135deg,#EEF2FF,#E0F2FE);border:1.5px dashed #A5B4FC;border-radius:16px;height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
.play-c{width:52px;height:52px;background:rgba(79,70,229,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;}

/* FAQ */
.faq-item{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.faq-q{width:100%;text-align:left;padding:18px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-family:'Manrope',sans-serif;font-weight:600;font-size:15px;color:var(--text);gap:12px;}
.faq-ico{flex-shrink:0;transition:transform 0.3s;color:var(--muted);}
.faq-item.open .faq-ico{transform:rotate(180deg);}
.faq-a{max-height:0;overflow:hidden;transition:max-height 0.35s ease,padding 0.35s;font-size:14px;color:var(--muted);line-height:1.7;padding:0 18px;}
.faq-item.open .faq-a{max-height:220px;padding:0 18px 18px;}

/* FOOTER */
footer{background:#fff;border-top:1px solid var(--border);padding:28px 20px;text-align:center;margin-top:8px;}
.foot-logo{display:inline-flex;align-items:center;gap:8px;margin-bottom:8px;}
.foot-powered{font-size:15px;font-weight:700;color:var(--text);font-family:'Manrope',sans-serif;}
.foot-copy{font-size:13px;color:var(--muted);margin-bottom:12px;}
.foot-links{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:16px;}
.foot-link{font-size:13px;color:var(--muted);text-decoration:none;font-weight:500;cursor:pointer;border:none;background:none;}
.foot-link:hover{color:var(--primary);}
.social-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
.soc-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:100px;font-size:13px;font-weight:700;text-decoration:none;transition:opacity 0.2s,transform 0.2s;font-family:'Manrope',sans-serif;}
.soc-btn:hover{opacity:0.85;transform:translateY(-1px);}
.soc-btn svg{width:15px;height:15px;fill:currentColor;flex-shrink:0;}
.sb-fb{background:#E7F3FF;color:#1877F2;}
.sb-ig{background:#FEE2F8;color:#bc1888;}
.sb-yt{background:#FFE9E9;color:#FF0000;}
.sb-tg{background:#E3F4FD;color:#229ED9;}

/* EXPLORE */
.exp-hdr{padding:28px 20px 0;max-width:900px;margin:0 auto;}
.exp-title{font-family:'Manrope',sans-serif;font-size:28px;font-weight:900;letter-spacing:-0.8px;margin-bottom:4px;}
.exp-sub{font-size:15px;color:var(--muted);font-weight:500;margin-bottom:20px;}
.search-box{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:10px;margin-bottom:16px;transition:border-color 0.2s;}
.search-box:focus-within{border-color:var(--primary);}
.search-box input{border:none;outline:none;font-size:15px;font-family:'DM Sans',sans-serif;color:var(--text);width:100%;background:transparent;}
.search-box input::placeholder{color:#94A3B8;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:100px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:#fff;color:var(--text);cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.chip:hover{border-color:var(--primary);color:var(--primary);}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

/* CONNECT CARDS */
.connect-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
.connect-card{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;text-decoration:none;transition:transform 0.2s,opacity 0.2s;color:white;}
.connect-card:hover{transform:translateY(-2px);opacity:0.92;}
.cc-icon{width:40px;height:40px;background:rgba(255,255,255,0.2);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cc-text{flex:1;min-width:0;}
.cc-name{font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;color:white;}
.cc-handle{font-size:10px;color:rgba(255,255,255,0.8);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cc-arrow{font-size:14px;color:rgba(255,255,255,0.7);flex-shrink:0;}
@media(max-width:400px){.connect-grid{grid-template-columns:1fr;}}

/* STATIC PAGES */
.spage{max-width:700px;margin:0 auto;padding:40px 20px;}
.spage h1{font-family:'Manrope',sans-serif;font-size:28px;font-weight:900;letter-spacing:-0.6px;margin-bottom:8px;}
.spage .psub{font-size:14px;color:var(--muted);margin-bottom:32px;}
.scard{background:#fff;border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:16px;}
.scard h2{font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;margin-bottom:8px;}
.scard p{font-size:14px;color:var(--muted);line-height:1.75;}
.scard-warn{background:#FFFBEB;border-color:#FDE68A;}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
.astat{background:linear-gradient(135deg,#EEF2FF,#E0F2FE);border-radius:14px;padding:20px;text-align:center;}
.astat .num{font-family:'Manrope',sans-serif;font-weight:900;font-size:28px;color:var(--primary);}
.astat .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px;}
.official-badge{display:inline-flex;align-items:center;gap:8px;background:#EEF2FF;border:1px solid #C7D2FE;border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:14px;font-weight:600;color:var(--primary);}
.official-badge svg{width:18px;height:18px;flex-shrink:0;}

/* NO RESULTS */
.no-res{text-align:center;padding:40px 20px;color:var(--muted);display:none;flex-direction:column;align-items:center;}
.no-res svg{width:48px;height:48px;margin-bottom:12px;opacity:0.35;}
.no-res h3{font-family:'Manrope',sans-serif;font-weight:700;font-size:17px;margin-bottom:4px;color:var(--text);}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#0F172A;color:#fff;padding:10px 22px;border-radius:100px;font-size:13px;font-weight:600;z-index:999;transition:transform 0.3s;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-inner">
    <div class="logo" onclick="goPage('home')">
      <div class="logo-icon">RS</div>
      <span class="logo-text">Reward Software</span>
    </div>
    <button class="hamburger" onclick="openMenu()">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- MENU -->
<div class="menu-overlay" id="mOverlay" onclick="closeMenu()"></div>
<div class="menu-drawer" id="mDrawer">
  <div class="menu-hdr">
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="logo-icon" style="width:32px;height:32px;font-size:12px;">RS</div>
      <span style="font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;">Reward Software</span>
    </div>
    <button class="menu-close" onclick="closeMenu()">✕</button>
  </div>
  <div class="menu-links">
    <button class="menu-link" onclick="goPage('home');closeMenu()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home
    </button>
    <button class="menu-link" onclick="goPage('listings');closeMenu()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Explore Listings
    </button>
    <div class="menu-div"></div>
    <but
